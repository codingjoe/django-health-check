[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-health-check"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [ "django", "postgresql" ]
license = { file = "LICENSE" }
authors = [
  { name = "Kristian Ollegaard", email = "kristian@oellegaard.com" },
  { name = "Johannes Maron", email = "johannes@maron.family" }
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dynamic = [
  "description",
  "version",
]
dependencies = [
  "django>=5.2",
  "dnspython>=2",
]
optional-dependencies.atlassian = [ "httpx>=0.27" ]
optional-dependencies.celery = [ "celery>=5" ]
optional-dependencies.crontask = [ "django-crontask[redis]>=2", "redis>=5.0.1" ]
optional-dependencies.kafka = [ "confluent-kafka>=2" ]
optional-dependencies.psutil = [ "psutil>=7.2" ]
optional-dependencies.rabbitmq = [ "aio-pika>=9" ]
optional-dependencies.redis = [ "redis>=5.0.1" ]
optional-dependencies.rss = [ "feedparser>=6", "httpx>=0.27" ]
optional-dependencies.threadmill = [ "threadmill[redis]>=0.7.3" ]
urls.Changelog = "https://github.com/codingjoe/django-health-check/releases"
urls.Documentation = "https://codingjoe.dev/django-health-check/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/django-health-check"
urls.Issues = "https://github.com/codingjoe/django-health-check/issues"
urls.Releasenotes = "https://github.com/codingjoe/django-health-check/releases/latest"
urls.Source = "https://github.com/codingjoe/django-health-check"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "boto3",
  "django-storages",
  "fakeredis",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-django",
  "testcontainers",
]
docs = [
  "markdown-callouts",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=0.18",
  "pygments",
]

[tool.setuptools_scm]
write_to = "health_check/_version.py"

[tool.flit]
module.name = "health_check"

[tool.uv]
# Always install the redis extras, even when another package requires the base distribution
override-dependencies = [
  "django-crontask[redis]>=2.0.0",
  "threadmill[redis]>=0.7.3",
]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
line_break_after_multiline_tag = true

[tool.ruff]
line-length = 88
lint.select = [
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "EXE", # flake8-executable
  "F",   # pyflakes
  "I",   # isort
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [ "D1", "D203", "D212", "E501" ]
lint.per-file-ignores."tests/*.py" = [ "PLR2004", "S101", "S105" ]
lint.isort.known-first-party = [ "measurement", "tests" ]

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.norecursedirs = ".git"
ini_options.python_files = "test_*.py"
ini_options.addopts = "--cov --strict-markers --cov-report=xml --cov-report=term --doctest-modules"
ini_options.markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
ini_options.xfail_strict = true
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "health_check" ]
report.skip_covered = true
report.show_missing = true
