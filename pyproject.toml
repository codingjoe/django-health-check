[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-health-check"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [ "django", "postgresql" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dynamic = [
  "description",
  "version",
]
dependencies = [
  "django>=6",
  "dnspython>=2",
  "httpx>=0.27",
]
[[project.authors]]
name = "Kristian Ollegaard"
email = "kristian@oellegaard.com"

[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
atlassian = []
celery = [ "celery>=5" ]
crontask = [ "django-crontask[redis]>=2", "redis>=5.0.1" ]
kafka = [ "confluent-kafka>=2" ]
psutil = [ "psutil>=7.2" ]
rabbitmq = [ "aio-pika>=9" ]
redis = [ "redis>=5.0.1" ]
rss = [ "feedparser>=6" ]
threadmill = [ "threadmill[redis]>=0.7.3" ]
[project.urls]
Changelog = "https://github.com/codingjoe/django-health-check/releases"
Documentation = "https://codingjoe.dev/django-health-check/"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/django-health-check"
Issues = "https://github.com/codingjoe/django-health-check/issues"
Releasenotes = "https://github.com/codingjoe/django-health-check/releases/latest"
Source = "https://github.com/codingjoe/django-health-check"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "boto3",
  "django-storages",
  "fakeredis",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-django",
  "testcontainers",
]
docs = [
  "markdown-callouts",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=0.18",
  "pygments",
]

[tool.setuptools_scm]
write_to = "health_check/_version.py"

[tool.flit]
[tool.flit.module]
name = "health_check"

[tool.uv]
# Always install the redis extras, even when another package requires the base distribution
override-dependencies = [
  "django-crontask[redis]>=2.0.0",
  "threadmill[redis]>=0.7.3",
]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
line_break_after_multiline_tag = true

[tool.ruff]
line-length = 88
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
isort.known-first-party = [ "measurement", "tests" ]

[tool.pytest]
[tool.pytest.ini_options]
testpaths = [
  "tests",
]
norecursedirs = ".git"
python_files = "test_*.py"
addopts = "--cov --strict-markers --cov-report=xml --cov-report=term --doctest-modules"
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
xfail_strict = true
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "health_check" ]
[tool.coverage.report]
skip_covered = true
show_missing = true
